name: Validate desktop installers and updates
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Runner list as JSON; use the default for release validation'
        default: '["windows-2022","windows-2025","ubuntu-22.04","ubuntu-24.04"]'
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Read pinned collection
        id: library
        shell: bash
        run: node -e "const fs=require('fs'),r=require('./data/library-source.json');if(!/^[a-f0-9]{40}$/.test(r.commit))throw Error('Unpinned collection');fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+r.commit+'\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: valleytechsolutions/black-wire-pinouts
          ref: ${{ steps.library.outputs.commit }}
          path: black-wire-pinouts
          persist-credentials: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Fetch Electron with bounded retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            node node_modules/electron/install.js && exit 0
            sleep 5
          done
          exit 1
      - run: pnpm library:import
        env:
          BLACKWIRE_LIBRARY_ROOT: black-wire-pinouts/library
      - run: node scripts/verify-library.mjs
      - run: pnpm test
      - run: pnpm build
      - run: pnpm desktop:prepare
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgtk-3-0 libgbm1 libfuse2
      - name: Build release and older updater fixture
        shell: bash
        run: |
          if [ '${{ runner.os }}' = 'Windows' ]; then
            pnpm exec electron-builder --config electron-builder.windows.cjs --win nsis --x64 --publish never
            pnpm exec electron-builder --config electron-builder.windows.cjs --win nsis --x64 --config.extraMetadata.version=0.13.99 --config.directories.output=qa-build --publish never
          else
            pnpm exec electron-builder --linux deb AppImage --x64 --publish never
            pnpm exec electron-builder --linux deb AppImage --x64 --config.extraMetadata.version=0.13.99 --config.directories.output=qa-build --publish never
          fi
      - name: Windows fresh install and in-app upgrade
        if: runner.os == 'Windows'
        run: node tests/installer-update.mjs
      - name: Linux DEB fresh install and in-app upgrade
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/installer-update.mjs
      - name: Linux AppImage launch and in-app upgrade
        if: matrix.os == 'ubuntu-22.04'
        run: xvfb-run -a node tests/installer-update.mjs --appimage
      - name: Save tested release assets
        uses: actions/upload-artifact@v7
        with:
          name: tested-desktop-${{ matrix.os }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            release/*/Black-Wire-*-setup.exe
            release/*/*.blockmap
            release/*/latest.yml
            release/*.deb
            release/*.AppImage
            release/latest-linux.yml
            data/qa/installer-*.json
            data/qa/*-updates.png
            data/qa/*-ready.png
      - name: Save native diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-diagnostics-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: data/qa/
